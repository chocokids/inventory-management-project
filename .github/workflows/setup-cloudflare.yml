name: Setup Cloudflare Worker

# One-time: create KV namespace, deploy Worker, print URL for VITE_API_URL.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        run: npm ci

      - name: Create KV namespace
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler kv namespace create STORE 2>&1) || true
          echo "$OUT"
          ID=$(echo "$OUT" | grep -oE 'id = "[a-f0-9]{32}"' | head -1 | grep -oE '[a-f0-9]{32}' || true)
          if [ -z "$ID" ]; then
            LIST=$(npx wrangler kv namespace list 2>&1)
            echo "$LIST"
            ID=$(echo "$LIST" | grep -i STORE | grep -oE '[a-f0-9]{32}' | head -1 || true)
          fi
          if [ -z "$ID" ]; then
            ID=$(echo "$LIST" | grep -oE '[a-f0-9]{32}' | head -1 || true)
          fi
          if [ -z "$ID" ]; then
            echo "Could not resolve KV namespace id"
            exit 1
          fi
          echo "KV_ID=$ID" >> "$GITHUB_OUTPUT"
          echo "Using KV id: $ID"
          sed -i "s/^id = \".*\"/id = \"$ID\"/" wrangler.toml
          sed -i "s/^preview_id = \".*\"/preview_id = \"$ID\"/" wrangler.toml
          cat wrangler.toml

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler deploy 2>&1)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -z "$URL" ]; then
            echo "Deploy succeeded but could not parse workers.dev URL"
            exit 1
          fi
          echo "WORKER_URL=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare setup"
            echo "- KV id: \`${{ steps.kv.outputs.KV_ID }}\`"
            echo "- Worker URL: \`$URL\`"
            echo "- Set GitHub Actions variable \`VITE_API_URL\` to that URL, then re-run Pages deploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit wrangler.toml with KV id
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/wrangler.toml
          if git diff --staged --quiet; then
            echo "No wrangler.toml changes to commit"
          else
            git commit -m "chore: set Cloudflare KV namespace id for inventory-api"
            git push
          fi
